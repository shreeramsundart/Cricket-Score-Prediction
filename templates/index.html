<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Score Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center bg-no-repeat min-h-screen flex flex-col" style="background-image: url('/static/images/cricket.png');">
    <div class="flex-grow flex items-center justify-center">
        <div class="bg-black bg-opacity-70 p-8 rounded-2xl shadow-xl w-11/12 md:w-2/3 lg:w-1/2">
            <h1 class="text-3xl font-bold text-center text-white mb-6">🏏 Cricket Score Predictor (T20)</h1>
            
            <form action="/" method="post" class="space-y-4">
                <label class="block text-white">Batting Team:</label>
                <select name="batting_team" id="batting_team" class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                    {% for team in teams %}
                    <option value="{{ team }}">{{ team }}</option>
                    {% endfor %}
                </select>
                
                <label class="block text-white">Bowling Team:</label>
                <select name="bowling_team" id="bowling_team" class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                    {% for team in teams %}
                    <option value="{{ team }}">{{ team }}</option>
                    {% endfor %}
                </select>
                
                <label class="block text-white">City:</label>
                <select name="city" id="city" class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                    {% for city in cities %}
                    <option value="{{ city }}">{{ city }}</option>
                    {% endfor %}
                </select>
                
                <label class="block text-white">Current Score:</label>
                <input type="number" id="current_score" name="current_score" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                
                <label class="block text-white">Balls Left:</label>
                <input type="number" id="balls_left" name="balls_left" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                
                <label class="block text-white">Wickets Left:</label>
                <input type="number" id="wicket_left" name="wicket_left" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                
                <label class="block text-white">Runs in Last 5 Overs:</label>
                <input type="number" id="last_five" name="last_five" required class="w-full px-4 py-2 rounded-lg border bg-gray-100 text-gray-900">
                
                <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-lg transition">Predict Score</button>
            </form>

            {% if prediction is not none %}
            <div class="mt-6 text-center bg-white bg-opacity-20 p-4 rounded-lg">
                <h2 class="text-xl font-bold text-white">Prediction Result</h2>
                <p class="text-white">Predicted Score: <strong>{{ prediction }}</strong></p>
            </div>
            {% endif %}
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full bg-black bg-opacity-50 text-white text-center py-4 mt-8">
        <p>© 2025 Shree Ram Sundar. All rights reserved.</p>
    </footer>
</body>
</html>
